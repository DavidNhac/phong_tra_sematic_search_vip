global:
  timeout: 30
  concurrency: 3
  retry_attempts: 2 # retry với backoff khi gặp 403/429/5xx hoặc lỗi mạng
  delay_between_requests: 2.0
  # User-Agent giống Chrome thật trên Windows để tránh bị chặn (403)
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  output_dir: "data/raw" # mỗi nguồn một file <name>.json, crawl lại sẽ ghi đè
  html_dir: "data/raw_html" # bản HTML gốc để sửa parser mà không cần crawl lại
  save_html: true

# priority: nguồn có số cao hơn được ưu tiên khi gộp địa chỉ/giá/giờ giữa các nguồn
# language: vi | en (bỏ trống = tự nhận diện từ nội dung)
# options: (tuỳ chọn) chỉnh riêng cho từng nguồn, vd heading_tags: [h3], name_pattern, max_section_chars
